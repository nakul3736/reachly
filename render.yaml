# Render service definition for the Reachly API.
#
# The database is deliberately NOT declared here. Render's free Postgres is deleted 30
# days after creation, which would mean betting the judged window on a countdown — and
# losing every uploaded resume when it expired. Reachly uses Aiven's free tier instead:
# always on, no expiry, no suspend. See ADR 0008.
#
# Secrets are marked sync:false, which means Render prompts for them in the dashboard
# rather than reading them from this file. Nothing secret belongs in a public repository.

services:
  - type: web
    name: reachly-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # Free instances are stopped when idle and take ~50s to wake. The keep-alive
    # workflow and cron-job.org both hit /internal/cron/keepalive to prevent a judge
    # meeting a cold start. Two triggers because one silently failing would be invisible.
    healthCheckPath: /api/v1/health

    envVars:
      # False so that a real resume is parsed by the real model. Demo mode serves recorded
      # responses, and a recorded response can only answer for resumes somebody recorded — a
      # judge or a student uploading their own PDF gets the demo parse, whose contents the
      # evidence check then correctly strips, leaving a resume with no roles and an upload that
      # looks broken. That is the failure this value exists to avoid.
      #
      # Set it back to "true" here or in the dashboard to run the whole product with no API key at
      # all, per ADR 0010. The seeded demo account works either way.
      - key: DEMO_MODE
        value: "false"

      # Declared rather than left to the code default so it is visible and changeable in the
      # dashboard without a deploy. Free-tier quotas are per model, and the model that has room in
      # it today may not tomorrow: gemini-3.6-flash returned 429 for every request on 23 Aug while
      # this one returned 200 with the same key in the same second. When that happens the fix
      # should be a dropdown, not a commit.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_STUDENT_EMAIL
        value: demo@reachly.app
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
