[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachly-backend"
version = "0.1.0"
description = "Reachly — job application pipeline for new graduates"
requires-python = ">=3.13"

# Versions are pinned deliberately. A build that changes behaviour because a
# transitive dependency moved is not a debugging problem worth having during a
# twelve-day project.
dependencies = [
    # web
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "python-multipart==0.0.20",

    # database
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "greenlet==3.2.4",

    # config and validation
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "email-validator==2.3.0",

    # auth — bcrypt used directly rather than via passlib, which breaks against
    # bcrypt >= 4.1 on recent Pythons
    "bcrypt==4.3.0",
    "pyjwt==2.10.1",

    # outbound http
    "httpx==0.28.1",
    # documents
    "pdfplumber==0.11.7",

    # deterministic matching (ADR 0003)
    "rapidfuzz==3.14.1",
    "rank-bm25==0.2.2",
]

# Declared explicitly rather than left to auto-discovery. Setuptools finds both `app` and
# `migrations` at the top level and refuses to guess between them, which failed CI while
# working locally — the local virtualenv was created before `migrations/` existed, so
# discovery had only ever seen one candidate. A fresh clone failed identically.
#
# `migrations` is deliberately excluded: Alembic runs it from the working directory and
# it is not an importable part of the application.
[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
    "pytest-env==1.1.5",
    "ruff==0.13.2",
    "mypy==1.18.2",
]

[tool.ruff]
line-length = 96
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S105", "S106"]  # hardcoded test credentials are intentional

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
# Tests must never reach an external API — see .kiro/steering/testing.md.
# The local Postgres from docker-compose.yml is not an external API; reachability
# is behaviour this project owns and must assert on.
env = [
    "DEMO_MODE=true",
    # A separate database from the one migrations target. The test fixture drops every
    # table between tests, which against the dev database would leave alembic_version
    # claiming head with no tables present — and autogenerate would then emit a
    # migration recreating tables that already exist in real deployments.
    "DATABASE_URL=postgresql+asyncpg://reachly:reachly_dev_only@localhost:55432/reachly_test",
    # Test-only signing key. Real deployments have no default — see app/config.py.
    "JWT_SECRET=test-only-signing-key-not-used-by-any-deployment",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "rank_bm25.*"]
ignore_missing_imports = true
